name: Desktop Release

# Builds the laintas-opencode desktop app (Electron) for Windows, macOS and
# Linux and attaches the installers to a GitHub Release. Modeled on
# upstream's desktop job in publish.yml (prepare -> build -> electron-builder
# --publish never) and on this repo's release.yml conventions (checkout v4,
# node 24, bun 1.4.4, softprops release upload, only the default
# GITHUB_TOKEN).
#
# - The sidecar CLI bundled into every channel build is this repo's own CLI
#   build (packages/opencode/dist), copied by packages/desktop/scripts/
#   prebuild.ts before packaging; nothing is downloaded from npm.
# - v1 ships unsigned and unnotarized: LAINTAS_DESKTOP_SIGN is unset, so the
#   electron-builder config disables macOS notarization, and the Windows
#   sign hook self-skips because no Azure Trusted Signing variables exist.
#   Windows shows a SmartScreen warning and macOS Gatekeeper blocks first
#   launch until the user allows the app manually.
# - No SENTRY_* / VITE_SENTRY_* variables are set on purpose: the desktop
#   must never report to the upstream Sentry project.
# - The in-app auto-updater is disabled for v1 (see
#   packages/desktop/src/main/constants.ts), so the latest*.yml files are
#   uploaded for completeness only.
# - The Linux leg also publishes the bare CLI binary as
#   laintas-opencode-linux-x64-baseline: the app's WSL support downloads it
#   from this release (packages/desktop/src/main/wsl/runtime.ts).

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag to build (e.g. desktop-v1.0.0)"
        required: true
        default: "desktop-v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            assets: |
              packages/desktop/dist/*.exe
              packages/desktop/dist/*.blockmap
              packages/desktop/dist/latest*.yml
          - os: macos-latest
            assets: |
              packages/desktop/dist/*.dmg
              packages/desktop/dist/*.zip
              packages/desktop/dist/*.blockmap
              packages/desktop/dist/latest*.yml
          - os: ubuntu-latest
            assets: |
              packages/desktop/dist/*.AppImage
              packages/desktop/dist/*.deb
              packages/desktop/dist/*.rpm
              packages/desktop/dist/*.blockmap
              packages/desktop/dist/latest*.yml
              release-assets/laintas-opencode-linux-x64-baseline
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      # --single --baseline builds this runner's platform targets (plain,
      # baseline and musl variants); the desktop prebuild copies the one
      # matching this runner into resources/opencode-cli.
      - name: Build CLI from this repo
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
        run: bun ./packages/opencode/script/build.ts --single --baseline

      - name: Prepare desktop (stamp version)
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: prod
        run: bun ./scripts/prepare.ts

      - name: Build desktop
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: prod
        run: bun run build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never --config electron-builder.config.ts

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          # No signing identity is provisioned for v1; do not let
          # electron-builder hunt for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never --config electron-builder.config.ts

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: npx electron-builder --linux --publish never --config electron-builder.config.ts

      - name: Stage WSL CLI asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          cp packages/opencode/dist/opencode-linux-x64-baseline/bin/laintas-opencode release-assets/laintas-opencode-linux-x64-baseline

      - name: Publish desktop release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ matrix.assets }}
          fail_on_unmatched_files: true
